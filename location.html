<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Визначення місця розташування</title>
</head>

<body>

<h1>Визначення місця розташування</h1>

<button onclick="getLocation()">
    Визначити моє місця розташування
</button>

<p id="result"></p>

<script>

async function getLocation() {

    const result = document.getElementById("result");

    if (!navigator.geolocation) {

        result.textContent =
            "Браузер не підтримує місця розташування.";

        return;
    }

    result.textContent =
        "Визначаємо місця розташування...";

    navigator.geolocation.getCurrentPosition(

        (position) => {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            result.textContent =
                `Широта: ${lat}, Долгота: ${lng}`;

            /*
             * Повертаємося в Swagger.
             *
             * Координати передаємо через URL.
             */

            const swaggerUrl =
                `/docs?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}`;

            setTimeout(() => {

                window.location.href = swaggerUrl;

            }, 1000);
        },

        (error) => {

            result.textContent =
                "Не вдалося визначити місце знаходження: " +
                error.message;
        }
    );
}

</script>

</body>

</html>
