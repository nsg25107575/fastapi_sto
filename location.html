<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моё местоположение</title>
</head>
<body>

<h1>Моё местоположение</h1>

<button onclick="getLocation()">
    Определить моё местоположение
</button>

<p id="result"></p>

<script>
async function getLocation() {

    if (!navigator.geolocation) {
        document.getElementById("result").textContent =
            "Браузер не поддерживает определение местоположения";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        async (position) => {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            document.getElementById("result").textContent =
                `Широта: ${lat}, Долгота: ${lng}`;

            const response = await fetch(
                "http://127.0.0.1:8001/location/",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        lat: lat,
                        lng: lng
                    })
                }
            );

            const data = await response.json();

            console.log(data);
        },

        (error) => {
            document.getElementById("result").textContent =
                "Не удалось получить местоположение: " + error.message;
        }
    );
}
</script>

</body>
</html>
