[project]
name = "kws-station-api"
version = "0.1.0"
requires-python = ">=3.14"
# Only DIRECT dependencies (actually imported by application code) are
# listed here. Transitive dependencies (click, h11, idna, cffi, mako,
# greenlet, anyio, httpcore, httpx, annotated-types, etc.) are resolved
# automatically and pinned exactly in requirements.txt -- do not add them
# here manually.
#
# Version ranges use `>=current,<next-major` (SemVer-style compatible
# release) instead of `==exact` so `make deps-update` can pick up new
# minor/patch releases automatically. A library's own major-version bump
# is excluded on purpose -- those are allowed to contain breaking changes
# and should be reviewed/upgraded deliberately (bump the upper bound by
# hand after testing).
dependencies = [
    # Web framework & server
    "fastapi>=0.142.2,<1.0.0",
    "starlette>=1.7.0,<2.0.0",
    "uvicorn>=0.54.0,<1.0.0",
    # Validation
    "pydantic>=2.13.5,<3.0.0",
    "email-validator>=2.3.0,<3.0.0",
    # Database / ORM / migrations
    "sqlalchemy>=2.1.2,<3.0.0",
    "alembic>=1.20.0,<2.0.0",
    "mariadb>=1.1.14,<2.0.0",
    # Auth
    # tzdata: the stdlib `zoneinfo` module (used via Config.app_timezone /
    # ZoneInfo("Europe/Kyiv") in config/config.py, models/token.py,
    # models/station.py) relies on the OS having IANA timezone data.
    # Linux/macOS normally ship it; Windows does NOT -- so this must stay
    # an explicit dependency, not just a transitive one pulled in by a
    # dev tool. `sys_platform == "win32"` keeps it out of non-Windows installs.
    "tzdata>=2026.4,<2027.0; sys_platform == 'win32'",
    "fastapi-login>=1.10.3,<2.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    # Config
    "python-dotenv>=1.2.4,<2.0.0",
    # Testing (kept as a direct dependency so `make test`/`make test-cov`
    # work out of the box without a separate dev-dependency group)
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    # httpx: used directly by services/geocoding.py (address -> lat/lng
    # lookup for station creation) -- no longer just a transitive
    # dependency of fastapi/starlette. httpx2: starlette's TestClient
    # (used by every integration test's `client`/`auth_client` fixture)
    # is now built on httpx2 -- plain httpx is deprecated for THAT
    # purpose (StarletteDeprecationWarning), but is still needed
    # directly for the geocoding HTTP client above.
    "httpx>=0.28.1,<1.0.0",
    "httpx2>=2.13.1,<3.0.0",
]
