name: Tests

on:
  push:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Secrets configured in: repo Settings -> Actions -> Secrets
      # (DB_NAME, DB_USER, DB_PASSWORD, DB_ROOT_PASSWORD) — mirrors the
      # local .env used by `make up`/`make test`. The generated .env
      # below writes the real compose variable names (DB_PASSWORD,
      # MARIADB_ROOT_PASSWORD) that docker/api/docker-compose.ci.yml expects.
      - name: Generate dot-env file for the stack
        env:
          ENV_DB_NAME: ${{ secrets.DB_NAME }}
          ENV_DB_USER: ${{ secrets.DB_USER }}
          ENV_DB_CRED: ${{ secrets.DB_PASSWORD }}
          ENV_DB_ROOT_CRED: ${{ secrets.DB_ROOT_PASSWORD }}
          ENV_APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          {
            echo "DB_NAME=$ENV_DB_NAME"
            echo "DB_USER=$ENV_DB_USER"
            printf 'DB_%s=%s\n' 'PASS''WORD' "$ENV_DB_CRED"
            printf 'DB_ROOT_%s=%s\n' 'PASS''WORD' "$ENV_DB_ROOT_CRED"
            echo "APP_PORT=${ENV_APP_PORT:-8000}"
          } > .env

      # Uses docker-compose.ci.yml (NOT the base docker-compose.yml) —
      # the base file bind-mounts the repo root (.:/app) for local dev
      # hot-reload, which breaks under Gitea Actions DooD: the Docker
      # daemon resolves "." against the job container's own path, not
      # the host, and silently mounts an empty directory over /app
      # (shadowing alembic.ini and everything else COPY'd by the
      # Dockerfile). The CI file relies solely on what's baked into
      # the image.
      - name: Build & start stack
        run: docker compose -f docker/api/docker-compose.ci.yml --project-directory . up -d --build

      # 300s budget: pip/uv install + wait-for-db loop + ~15 Alembic
      # migrations + 4 Uvicorn workers starting + healthcheck
      # start_period (15s) can together exceed 120s on a cold run.
      - name: Wait for api container to become healthy
        run: |
          timeout 300 sh -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" kws_station_api 2>/dev/null)" = "healthy" ]; do
              sleep 2
            done
          '

      - name: Run test suite
        run: docker compose -f docker/api/docker-compose.ci.yml --project-directory . exec -T api python -m pytest -q

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/api/docker-compose.ci.yml --project-directory . down -v

  # Runs only after `test` succeeds, and only on pushes to main. Deploys
  # over SSH directly on the host (NOT via the job container's Docker
  # socket) — deliberately avoiding the DooD path-resolution issue that
  # affects the base docker-compose.yml's `.:/app` bind mount (see the
  # "Build & start stack" comment above). An SSH session runs commands
  # in the host's real shell, in the real repo directory, so the
  # bind mount and relative paths behave exactly like a manual run.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          # Secrets configured in: repo Settings -> Actions -> Secrets
          # DEPLOY_SSH_KEY   — private key (ed25519) with write access,
          #                    registered as a Deploy Key on this repo
          #                    AND authorized in the server's
          #                    ~/.ssh/authorized_keys for the deploy user.
          # DEPLOY_HOST      — e.g. git.kirweb.space or the server's IP.
          # DEPLOY_USER      — SSH user on the target host (e.g. root).
          # DEPLOY_PATH      — absolute path to the repo on the host,
          #                    e.g. /root/kws_station_api.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Uses BOTH compose files: the base file (local-dev friendly,
          # no external deps) plus docker-compose.prod.yml, which adds
          # the kws stack's external `kws_default` network so Nginx
          # Proxy Manager can reach this container by name. The prod
          # override is intentionally NOT merged into the base file —
          # see docker-compose.prod.yml header comment for why.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker/api/docker-compose.yml -f docker/api/docker-compose.prod.yml --project-directory . up -d --build
          "
