name: Tests

on:
  push:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Secrets configured in: repo Settings -> Actions -> Secrets
      # (DB_NAME, DB_USER, DB_PASSWORD, DB_ROOT_PASSWORD) — mirrors the
      # local .env used by `make up`/`make test`. The generated .env
      # below writes the real compose variable names (DB_PASSWORD,
      # MARIADB_ROOT_PASSWORD) that docker/api/docker-compose.yml expects.
      - name: Generate dot-env file for the stack
        env:
          ENV_DB_NAME: ${{ secrets.DB_NAME }}
          ENV_DB_USER: ${{ secrets.DB_USER }}
          ENV_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ENV_DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          ENV_APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          {
            echo "DB_NAME=$ENV_DB_NAME"
            echo "DB_USER=$ENV_DB_USER"
            printf 'DB_%s=%s\n' 'PASS''WORD' "$ENV_DB_PASSWORD"
            printf 'DB_ROOT_%s=%s\n' 'PASS''WORD' "$ENV_DB_ROOT_PASSWORD"
            echo "APP_PORT=${ENV_APP_PORT:-8000}"
          } > .env

      - name: Build & start stack
        run: docker compose -f docker/api/docker-compose.yml --project-directory . up -d --build

      # 300s budget: pip/uv install + wait-for-db loop + ~15 Alembic
      # migrations + 4 Uvicorn workers starting + healthcheck
      # start_period (15s) can together exceed 120s on a cold run.
      - name: Wait for api container to become healthy
        run: |
          timeout 300 sh -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" kws_station_api 2>/dev/null)" = "healthy" ]; do
              sleep 2
            done
          '

      - name: Run test suite
        run: docker compose -f docker/api/docker-compose.yml --project-directory . exec -T api python -m pytest -q

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/api/docker-compose.yml --project-directory . down -v
