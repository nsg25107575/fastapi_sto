# This compose file lives under docker/api/ so the Docker setup can be
# extended with additional services (e.g. docker/worker/, docker/nginx/)
# without cluttering the project root. Run it from the project root with:
#   docker compose -f docker/api/docker-compose.yml --project-directory . up -d --build
# (the Makefile targets already do this). --project-directory . is required
# so that Compose resolves .env, build context, and volume paths below
# relative to the repo root instead of docker/api/.
#
# This base file is fully self-contained and has NO external network
# dependency — it works out of the box on any machine (local dev,
# CI image build, etc.). The production-only requirement (joining the
# kws stack's `kws_default` network so Nginx Proxy Manager can reach
# this container by name) lives in docker-compose.prod.yml, applied
# only when deploying — see that file's header comment for why.
services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: ${APP_NAME:-kws_station_api}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "mariadb+mariadbconnector://${DB_USER:-root}:${DB_PASSWORD:-}@${DB_HOST:-kws_station_db}:${DB_PORT:-3306}/${DB_NAME:-kws_station}"
      DB_HOST: ${DB_HOST:-kws_station_db}
      APP_PORT: "${APP_PORT:-8333}"
      # Scale workers to CPU cores available to this container; raise together
      # with the resource limits below and MariaDB max_connections.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-"4"}
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-"1000"}
      UVICORN_BACKLOG: ${UVICORN_BACKLOG:-"2048"}
      UVICORN_KEEPALIVE: ${UVICORN_KEEPALIVE:-"5"}
      # Per-worker SQLAlchemy pool; total DB connections used by this
      # service scales as UVICORN_WORKERS * (DB_POOL_SIZE + DB_POOL_MAX_OVERFLOW).
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      DB_POOL_MAX_OVERFLOW: "${DB_POOL_MAX_OVERFLOW:-20}"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-30}"
      DB_POOL_RECYCLE: "${DB_POOL_RECYCLE:-1800}"
    ports:
      - "${APP_PORT:-8333}:${APP_PORT:-8333}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - kws_station_net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g
        reservations:
          cpus: "1"
          memory: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: mariadb:latest
    container_name: ${DB_HOST:-kws_station_db}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-}"
      MARIADB_DATABASE: "${DB_NAME:-kws_station}"
      MARIADB_USER: "${DB_USER:-kws_station}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-}"
    # Tuning for high concurrency: raise max_connections, give InnoDB a
    # bigger buffer pool, and use several I/O threads. Adjust
    # innodb_buffer_pool_size to ~60-70% of the memory limit below.
    command:
      - --max_connections=1000
      - --innodb_buffer_pool_size=1G
      - --innodb_buffer_pool_instances=4
      - --innodb_log_file_size=256M
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_flush_method=O_DIRECT
      - --innodb_read_io_threads=8
      - --innodb_write_io_threads=8
      - --table_open_cache=4000
      - --thread_cache_size=128
      - --query_cache_type=0
      - --query_cache_size=0
    ports:
      - "${DB_HOST_PORT:-3310}:3306"
    volumes:
      - kws_station_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g
        reservations:
          cpus: "1"
          memory: 1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - kws_station_net

volumes:
  kws_station_db_data:

networks:
  kws_station_net:
    driver: bridge
