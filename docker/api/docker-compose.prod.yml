# Production override — joins the kws stack's own Docker network so
# Nginx Proxy Manager (running as part of ~/kws/docker-compose.yml) can
# reach this container directly by name (http://kws_station_api:8000)
# instead of a host bridge IP, which NPM (itself a container) cannot
# resolve. Without this, requests to the public domain return a
# 502 Bad Gateway.
#
# This file is NOT merged automatically — it is deliberately separate
# from the base docker-compose.yml so that file stays dependency-free
# and works on any machine (local dev, CI). Apply this override only
# when deploying to the server where the kws stack already exists:
#
#   docker compose -f docker/api/docker-compose.yml -f docker/api/docker-compose.prod.yml --project-directory . up -d --build
#
# Requires: the `kws_default` network must already exist on the host
# (created automatically by ~/kws/docker-compose.yml — the kws stack
# itself must be running, or at least have been started once).
#
# IMPORTANT — DB_HOST override: the kws stack's own Postgres service
# is ALSO named "db" inside kws_default (its compose file's service
# key), and both docker-compose projects register that short name as
# a network alias. Once `api` joins kws_default, Docker's embedded DNS
# resolves the ambiguous name "db" to whichever container registered
# it last — which turned out to be the kws stack's Postgres, not this
# project's MariaDB, causing "Connection refused" (right host network,
# wrong container). Fix: address the database by its container_name
# (kws_station_db), which stays globally unique across every network
# this host runs — unlike the generic service name "db".
services:
  api:
    environment:
      DATABASE_URL: "mariadb+mariadbconnector://kws_station_db:${DB_PORT:-3306}/${DB_NAME}"
      DB_HOST: kws_station_db
    networks:
      - kws_station_net
      - kws_default

networks:
  kws_station_net:
    driver: bridge
  kws_default:
    external: true
